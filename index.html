addEventListener('resize',fit);fit();

// audio
let ac=null;function A(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}return ac;}
function slapSound(power){const a=A();if(!a)return;const n=a.sampleRate*.18,buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,4);
 const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=1800+Math.random()*900;f.Q.value=.7;
 const gn=a.createGain();gn.gain.value=.6+power*.4;s.connect(f).connect(gn).connect(a.destination);s.start();
 const o=a.createOscillator(),og=a.createGain();o.frequency.setValueAtTime(160,a.currentTime);o.frequency.exponentialRampToValueAtTime(50,a.currentTime+.15);
 og.gain.setValueAtTime(.35,a.currentTime);og.gain.exponentialRampToValueAtTime(.001,a.currentTime+.15);o.connect(og).connect(a.destination);o.start();o.stop(a.currentTime+.16);}
function boing(){const a=A();if(!a)return;const o=a.createOscillator(),gn=a.createGain();o.type='sine';
 o.frequency.setValueAtTime(300,a.currentTime);o.frequency.exponentialRampToValueAtTime(900,a.currentTime+.12);o.frequency.exponentialRampToValueAtTime(400,a.currentTime+.3);
 gn.gain.setValueAtTime(.12,a.currentTime);gn.gain.exponentialRampToValueAtTime(.001,a.currentTime+.3);o.connect(gn).connect(a.destination);o.start();o.stop(a.currentTime+.3);}
function ding(f){const a=A();if(!a)return;const o=a.createOscillator(),gn=a.createGain();o.type='triangle';o.frequency.value=f;
 gn.gain.setValueAtTime(.12,a.currentTime);gn.gain.exponentialRampToValueAtTime(.001,a.currentTime+.25);o.connect(gn).connect(a.destination);o.start();o.stop(a.currentTime+.25);}

function startRound(){mode='play';slaps=0;combo=0;timeLeft=30;marks=[];ding(660);setTimeout(()=>ding(990),120);}
function slap(x,y){
 if(mode==='menu'||(mode==='over'&&now-overAt>1)){startRound();return;}
 if(mode!=='play')return;
 const dx=(x-FX)/(FW/2),dy=(y-FY)/(FH/2);
 if(dx*dx+dy*dy>1.3){boing();words.push({x,y,t:0,s:'MISS',c:'#9aa',sz:22});combo=0;return;}
 const dir=x<FX?1:-1; // slap from left pushes face right
 combo=(now-lastSlap<.6)?combo+1:1;lastSlap=now;
 const power=Math.min(1,.4+combo*.06);
 slaps++;total++;
 face_s.va+=dir*(.25+power*.25);face_s.vx+=dir*(10+power*14);face_s.vsq-=.05+power*.05;
 shake=6+power*10;
 marks.push({x:(x-FX),y:(y-FY),a:.75,r:28+Math.random()*10,rot:Math.random()*6});if(marks.length>14)marks.shift();
 hands.push({x:x,y:y,dir,t:0});
 for(let i=0;i<10+combo;i++){const a=Math.random()*7;fx.push({x,y,vx:Math.cos(a)*(3+Math.random()*6),vy:Math.sin(a)*(3+Math.random()*6)-2,l:1,c:['#ffd23f','#fff','#ff7aa2','#7ff5e0'][i%4],s:3+Math.random()*4});}
 for(let i=0;i<3;i++)stars.push({a:Math.random()*7,t:0});
 if(words.filter(w=>!w.big).length>2)words.splice(words.findIndex(w=>!w.big),1);words.push({x:x+(Math.random()-.5)*40,y:y-30,t:0,s:WORDS[Math.random()*WORDS.length|0],c:'#fff',sz:30+power*18,rot:(Math.random()-.5)*.5});
 for(const [n,s] of COMBO)if(combo===n){words.push({x:W/2,y:170,t:0,s,c:'#ffd23f',sz:44,rot:0,big:1});ding(880);setTimeout(()=>ding(1320),90);}
 slapSound(power);
 if(navigator.vibrate)try{navigator.vibrate(25)}catch(e){}
}
let overAt=0;
cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect();slap((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height);});
addEventListener('keydown',e=>{if(e.repeat)return;
 if(e.code==='ArrowLeft'||e.code==='KeyA')slap(FX-70,FY+30+Math.random()*30);
 else if(e.code==='ArrowRight'||e.code==='KeyD')slap(FX+70,FY+30+Math.random()*30);
 else if(e.code==='Space'){e.preventDefault();slap(FX+(Math.random()<.5?-70:70),FY+30);}});

function update(dt){now+=dt;
 // spring physics
 face_s.va+=(-face_s.ang*60-face_s.va*7)*dt;face_s.ang+=face_s.va*dt*8;
 face_s.vx+=(-face_s.dx*90-face_s.vx*9)*dt;face_s.dx+=face_s.vx*dt*8;
 face_s.vsq+=(-(face_s.sq-1)*120-face_s.vsq*10)*dt;face_s.sq+=face_s.vsq*dt*8;
 face_s.ang=Math.max(-.7,Math.min(.7,face_s.ang));face_s.dx=Math.max(-90,Math.min(90,face_s.dx));
 for(const m of marks)m.a=Math.max(0,m.a-dt*.05);
 for(const p of fx){p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.l-=dt*1.6;}fx=fx.filter(p=>p.l>0);
 for(const h of hands)h.t+=dt;hands=hands.filter(h=>h.t<.28);
 for(const w of words)w.t+=dt;words=words.filter(w=>w.t<(w.big?1.2:.7));
 for(const s of stars)s.t+=dt;stars=stars.filter(s=>s.t<1.4);
 if(shake>0)shake*=Math.pow(.02,dt);
 if(mode==='play'&&now-lastSlap>.6)combo=0;
 if(mode==='play'){timeLeft-=dt;if(timeLeft<=0){timeLeft=0;mode='over';overAt=now;
  if(slaps>best){best=slaps;}try{localStorage.setItem('slapface_best',best);localStorage.setItem('slapface_total',total)}catch(e){}
  ding(520);setTimeout(()=>ding(390),150);setTimeout(()=>ding(260),300);}}
}

function txt(s,x,y,sz,col='#fff',rot=0,a=1){g.save();g.globalAlpha=a;g.translate(x,y);g.rotate(rot);
 g.font=`900 ${sz}px system-ui,Arial Black,sans-serif`;g.textAlign='center';g.textBaseline='middle';
 g.lineJoin='round';g.lineWidth=sz/5;g.strokeStyle='#1a1033';g.strokeText(s,0,0);g.fillStyle=col;g.fillText(s,0,0);g.restore();}

function drawHand(h){const p=h.t/.28;const sx=h.dir>0?-1:1; // comes from the side it hits
 const startX=h.x+sx*170,x=startX+(h.x-startX)*Math.min(1,p*3)+(p>.33?sx*(p-.33)*120:0);
 g.save();g.globalAlpha=p<.6?1:1-(p-.6)/.4;g.translate(x,h.y);g.scale(-sx,1);g.rotate(-.2);
 // motion lines
 g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=4;g.lineCap='round';
 for(let i=0;i<3;i++){g.beginPath();g.moveTo(-60-i*6,-24+i*22);g.lineTo(-110-i*10,-24+i*22);g.stroke();}
 g.fillStyle='#ffc9a3';g.strokeStyle='#7a3e22';g.lineWidth=3;
 // palm
 g.beginPath();g.roundRect(-45,-30,60,64,18);g.fill();g.stroke();
 // fingers
 for(let i=0;i<4;i++){g.beginPath();g.roundRect(10,-30+i*16,40-Math.abs(i-1.5)*5,14,7);g.fill();g.stroke();}
 // thumb
 g.beginPath();g.ellipse(-8,-36,18,9,-.6,0,7);g.fill();g.stroke();
 // sleeve
 g.fillStyle='#4a6cff';g.strokeStyle='#1a1033';g.beginPath();g.roundRect(-75,-28,32,60,6);g.fill();g.stroke();
 g.restore();}

function render(){
 g.save();if(shake>.3)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 // background: radial burst
 const bg=g.createRadialGradient(FX,FY,40,FX,FY,520);bg.addColorStop(0,'#ff8a3d');bg.addColorStop(.5,'#c2367a');bg.addColorStop(1,'#2a1050');
 g.fillStyle=bg;g.fillRect(-30,-30,W+60,H+60);
 g.save();g.translate(FX,FY);g.rotate(now*.15);g.fillStyle='rgba(255,255,255,.07)';
 for(let i=0;i<16;i++){g.rotate(Math.PI/8);g.beginPath();g.moveTo(0,0);g.lineTo(700,-70);g.lineTo(700,70);g.fill();}g.restore();
 // face
 g.save();g.translate(FX+face_s.dx,FY+80);g.rotate(face_s.ang);g.scale(1/face_s.sq,face_s.sq);g.translate(0,-80);
 g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(6,10,FW/2+6,FH/2+6,0,0,7);g.fill();
 g.save();g.beginPath();g.ellipse(0,0,FW/2,FH/2,0,0,7);g.clip();
 if(face.complete&&face.naturalWidth)g.drawImage(face,-FW/2,-FH/2,FW,FH);
 // slap marks: red handprint blush
 for(const m of marks){g.save();g.translate(m.x,m.y);g.rotate(m.rot);g.globalAlpha=m.a*.55;
  const rg=g.createRadialGradient(0,0,2,0,0,m.r);rg.addColorStop(0,'#ff2a4a');rg.addColorStop(1,'rgba(255,42,74,0)');g.fillStyle=rg;
  g.beginPath();g.arc(0,0,m.r,0,7);g.fill();
  g.globalAlpha=m.a*.35;g.fillStyle='#ff2a4a';for(let i=0;i<4;i++){g.beginPath();g.ellipse(-12+i*8,-m.r*.9,3.5,12,0,0,7);g.fill();}
  g.restore();}
 g.restore();
 g.lineWidth=7;g.strokeStyle='#ffd23f';g.beginPath();g.ellipse(0,0,FW/2,FH/2,0,0,7);g.stroke();
 g.lineWidth=3;g.strokeStyle='#1a1033';g.beginPath();g.ellipse(0,0,FW/2+4,FH/2+4,0,0,7);g.stroke();
 g.restore();
 // dizzy stars orbit
 for(const s of stars){const a=s.a+s.t*5,al=1-s.t/1.4;const x=FX+face_s.dx+Math.cos(a)*110,y=FY-FH/2+10+Math.sin(a)*22;
  g.save();g.globalAlpha=al;g.translate(x,y);g.rotate(s.t*6);g.fillStyle='#ffd23f';g.strokeStyle='#1a1033';g.lineWidth=2;g.beginPath();
  for(let i=0;i<10;i++){const r=i%2?5:12;g.lineTo(Math.cos(i*Math.PI/5)*r,Math.sin(i*Math.PI/5)*r);}g.closePath();g.fill();g.stroke();g.restore();}
 for(const h of hands)drawHand(h);
 for(const p of fx){g.globalAlpha=Math.max(0,p.l);g.fillStyle=p.c;g.fillRect(p.x,p.y,p.s,p.s);}g.globalAlpha=1;
 for(const w of words){const life=w.big?1.2:.7,p=w.t/life,sc=p<.15?p/.15*1.2:1.2-(p-.15)*.3;
  txt(w.s,w.x,w.y-p*(w.big?10:40),w.sz*sc,w.c,w.rot||0,1-Math.max(0,(p-.6)/.4));}
 g.restore();

 // HUD
 if(mode==='play'){
  txt(slaps,W/2,60,56);txt('SLAPS',W/2,100,16,'#ffd23f');
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.roundRect(30,640,W-60,18,9);g.fill();
  g.fillStyle=timeLeft<5?'#ff4d6d':'#57e39b';g.beginPath();g.roundRect(30,640,(W-60)*timeLeft/30,18,9);g.fill();
  txt(Math.ceil(timeLeft)+'s',W/2,620,20);
  if(combo>1)txt('x'+combo+' COMBO',W-70,60,20,'#7ff5e0',.15);
  txt('BEST '+best,70,60,16,'#fff',-.1);
 } else {
  g.fillStyle='rgba(26,16,51,.55)';g.fillRect(0,0,W,H);
  if(mode==='menu'){txt('SLAP FACE',W/2,110,58,'#ffd23f',-.05);
   txt('How many slaps in 30 seconds?',W/2,165,18);
   txt('Tap his face!',W/2,560,30);
   txt('Keys: ← → / A D / Space',W/2,600,16,'#7ff5e0');
   txt('Best: '+best+'   ·   All-time slaps: '+total,W/2,640,14,'#fff');}
  else{txt("TIME'S UP!",W/2,110,52,'#ff7aa2',-.04);
   g.fillStyle='rgba(26,16,51,.9)';g.strokeStyle='#ffd23f';g.lineWidth=4;g.beginPath();g.roundRect(W/2-130,500,260,120,18);g.fill();g.stroke();
   txt('Slaps',W/2-60,530,16,'#7ff5e0');txt(slaps,W/2-60,575,42);txt('Best',W/2+60,530,16,'#7ff5e0');txt(best,W/2+60,575,42,'#ffd23f');
   const r=slaps>=150?'Hand of fury 🔥':slaps>=100?'Pro slapper':slaps>=60?'Solid effort':'Gentle tapper';
   txt(r,W/2,175,22,'#fff');
   if(now-overAt>1)txt('Tap to slap again',W/2,660,20);}
 }
}
let last=performance.now();
(function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);render();requestAnimationFrame(loop);})(last);
</script></body></html>
